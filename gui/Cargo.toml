[package]
name = "gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "minesweep_rs"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
minesweeper_core = { path = "../minesweeper_core" }
egui = "0.37.0"
egui_extras = { version = "0.37", features = ["svg"] }
eframe = { version = "0.37.0", default-features = false, features = [
  "persistence",
  "default_fonts",
  "system_fonts",
  "wayland",
  "x11",
  "glow",
] }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"

# windows build deps
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
